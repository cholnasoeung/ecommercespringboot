spring.application.name=product-api

# ---- Database ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name_here}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key_here}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret_here}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB



# The folder where images will be saved on your computer
app.upload.dir=C:/product-images/
# ---- Server ----
server.port=${PORT:8080}